<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>谿山行旅：尋隱者不遇</title>
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        body { margin: 0; overflow: hidden; background-color: #2c2c2c; font-family: 'Courier New', Courier, monospace; touch-action: none; }
        #gameCanvas { display: block; width: 100%; height: 100%; background: #e0d8c0; }
        
        /* UI 覆蓋層 */
        #uiLayer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 頂部資訊 */
        #header { padding: 10px; text-align: center; color: #3e3e3e; font-weight: bold; font-size: 18px; text-shadow: 1px 1px 0 #fff; pointer-events: auto; }
        
        /* 開始/結束畫面 */
        #modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 248, 230, 0.95); border: 2px solid #555; padding: 20px;
            width: 80%; max-width: 400px; text-align: center; border-radius: 8px;
            pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; color: #222; }
        p { font-size: 14px; line-height: 1.6; color: #444; text-align: left; }
        .btn {
            background: #8b4513; color: #fff; padding: 12px 24px; border: none; border-radius: 4px;
            font-size: 18px; cursor: pointer; margin-top: 15px; width: 100%;
        }
        .btn:active { background: #6f370f; }

        /* 觸控按鈕 */
        #controls {
            display: flex; width: 100%; height: 120px; pointer-events: auto;
            padding-bottom: 20px;
        }
        .touch-btn {
            flex: 1; background: rgba(0,0,0,0.1); border: 1px dashed #555;
            margin: 5px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; user-select: none;
        }
        .touch-btn:active { background: rgba(0,0,0,0.3); }

        /* 隱藏元素 */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="uiLayer">
        <div id="header">分數: <span id="score">0</span> | 尋找范寬款識...</div>
        
        <div id="modal">
            <h1>谿山行旅圖<br>山徑探險</h1>
            <p>
                <b>說明：</b>您是畫中的驢隊，正運貨經過北宋的山林。<br>
                1. 點擊下方<b>左右按鈕</b>移動。<br>
                2. 躲避落下的<b>墨點</b>（雨點皴）。<br>
                3. 收集<b>紅色印章</b>得分。<br>
                4. 留意右下角樹叢，尋找隱藏的<b>「范寬」</b>簽名！
            </p>
            <button class="btn" id="startBtn">開始行旅</button>
        </div>

        <div id="controls" class="hidden">
            <div class="touch-btn" id="leftBtn">◀ 向左</div>
            <div class="touch-btn" id="rightBtn">向右 ▶</div>
        </div>
    </div>

    <script>
        // --- 遊戲設定 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const modal = document.getElementById('modal');
        const scoreEl = document.getElementById('score');
        const controls = document.getElementById('controls');
        let animationId;
        let score = 0;
        let gameSpeed = 3;
        let isGameOver = false;
        let foundSignature = false;

        // 調整畫布大小
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 遊戲狀態
        const state = {
            player: { x: 0, y: 0, w: 40, h: 40, color: '#4a3b2a' }, // 驢隊顏色
            obstacles: [], // 墨點
            coins: [], // 印章
            signature: null, // 范寬簽名
            frame: 0
        };

        // --- 繪圖函數 ---
        
        // 畫背景 (仿水墨質感)
        function drawBackground() {
            // 遠景：主山 (淡墨)
            ctx.fillStyle = '#cfc6b0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = 'rgba(40, 40, 40, 0.1)';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height);
            ctx.lineTo(canvas.width * 0.2, canvas.height * 0.4);
            ctx.lineTo(canvas.width * 0.5, canvas.height * 0.2);
            ctx.lineTo(canvas.width * 0.8, canvas.height * 0.4);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.fill();

            // 文本提到的：路側車馬紆行
            ctx.fillStyle = '#bbb3a0';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
        }

        // 畫驢隊
        function drawPlayer() {
            ctx.fillStyle = state.player.color;
            // 簡單畫個驢子形狀
            ctx.fillRect(state.player.x, state.player.y, state.player.w, state.player.h);
            // 貨物
            ctx.fillStyle = '#8b4513';
            ctx.fillRect(state.player.x + 5, state.player.y - 10, state.player.w - 10, 10);
            
            // 文字標示
            ctx.fillStyle = '#fff';
            ctx.font = '10px Arial';
            ctx.fillText("驢隊", state.player.x + 8, state.player.y + 25);
        }

        function drawObstacles() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)'; // 濃墨
            state.obstacles.forEach(obs => {
                ctx.beginPath();
                ctx.arc(obs.x, obs.y, obs.r, 0, Math.PI * 2);
                ctx.fill();
                // 模擬雨點皴的效果 (稍微拉長)
                ctx.beginPath();
                ctx.moveTo(obs.x, obs.y);
                ctx.lineTo(obs.x, obs.y - 10);
                ctx.stroke();
            });
        }

        function drawCoins() {
            state.coins.forEach(coin => {
                // 印章樣式
                ctx.fillStyle = '#b22222'; // 印泥紅
                ctx.fillRect(coin.x, coin.y, coin.w, coin.h);
                ctx.strokeStyle = '#fff';
                ctx.strokeRect(coin.x, coin.y, coin.w, coin.h);
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.fillText("印", coin.x + 2, coin.y + 12);
            });
        }

        function drawSignature() {
            if (state.signature) {
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Courier New';
                ctx.fillText("范寬", state.signature.x, state.signature.y);
                
                // 閃爍效果
                if (Math.floor(Date.now() / 200) % 2 === 0) {
                    ctx.strokeStyle = 'gold';
                    ctx.lineWidth = 2;
                    ctx.strokeText("范寬", state.signature.x, state.signature.y);
                }
            }
        }

        // --- 邏輯函數 ---

        function initGame() {
            state.player.x = canvas.width / 2 - 20;
            state.player.y = canvas.height - 150;
            state.obstacles = [];
            state.coins = [];
            state.signature = null;
            state.frame = 0;
            score = 0;
            gameSpeed = 3;
            isGameOver = false;
            foundSignature = false;
            scoreEl.innerText = score;
            controls.classList.remove('hidden');
        }

        function spawnEntities() {
            // 產生墨點障礙 (雨點皴)
            if (state.frame % 40 === 0) {
                const r = 5 + Math.random() * 10;
                state.obstacles.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    r: r,
                    speed: gameSpeed + Math.random()
                });
            }

            // 產生印章 (加分)
            if (state.frame % 150 === 0) {
                state.coins.push({
                    x: Math.random() * (canvas.width - 30),
                    y: -30,
                    w: 20,
                    h: 20,
                    speed: gameSpeed
                });
            }

            // 產生隱藏簽名 (機率極低，或在特定分數後出現)
            // 文本提到在「右角樹蔭下」，我們讓它偏右出現
            if (!foundSignature && !state.signature && score > 500 && Math.random() < 0.01) {
                state.signature = {
                    x: canvas.width * 0.7 + Math.random() * (canvas.width * 0.2), // 偏右
                    y: -50,
                    w: 40,
                    h: 20,
                    speed: gameSpeed * 1.2
                };
            }
        }

        function update() {
            state.frame++;
            if (state.frame % 500 === 0) gameSpeed += 0.5; // 隨時間變快

            // 移動障礙物
            state.obstacles.forEach((obs, index) => {
                obs.y += obs.speed;
                // 碰撞檢測 (簡單圓形vs矩形)
                if (obs.x > state.player.x && obs.x < state.player.x + state.player.w &&
                    obs.y > state.player.y && obs.y < state.player.y + state.player.h) {
                    gameOver();
                }
                if (obs.y > canvas.height) state.obstacles.splice(index, 1);
            });

            // 移動印章
            state.coins.forEach((coin, index) => {
                coin.y += coin.speed;
                // 碰撞 (收集)
                if (coin.x < state.player.x + state.player.w && coin.x + coin.w > state.player.x &&
                    coin.y < state.player.y + state.player.h && coin.y + coin.h > state.player.y) {
                    score += 100;
                    scoreEl.innerText = score;
                    state.coins.splice(index, 1);
                }
                if (coin.y > canvas.height) state.coins.splice(index, 1);
            });

            // 移動簽名
            if (state.signature) {
                state.signature.y += state.signature.speed;
                // 碰撞 (發現簽名)
                if (state.signature.x < state.player.x + state.player.w && state.signature.x + 40 > state.player.x &&
                    state.signature.y < state.player.y + state.player.h && state.signature.y > state.player.y) {
                    foundSignature = true;
                    score += 5000;
                    scoreEl.innerText = score;
                    state.signature = null;
                    gameOver(true); // 找到簽名視為完美通關
                }
                if (state.signature.y > canvas.height) state.signature = null; // 錯過了
            }
        }

        function loop() {
            if (isGameOver) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            drawBackground();
            spawnEntities();
            update();
            drawPlayer();
            drawObstacles();
            drawCoins();
            drawSignature();
            
            animationId = requestAnimationFrame(loop);
        }

        // --- 控制 ---
        let moveInterval;
        
        function startMove(direction) {
            if (moveInterval) clearInterval(moveInterval);
            moveInterval = setInterval(() => {
                if (direction === 'left' && state.player.x > 0) {
                    state.player.x -= 8;
                } else if (direction === 'right' && state.player.x < canvas.width - state.player.w) {
                    state.player.x += 8;
                }
            }, 16);
        }

        function stopMove() {
            clearInterval(moveInterval);
        }

        // 觸控事件
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');

        ['touchstart', 'mousedown'].forEach(evt => {
            leftBtn.addEventListener(evt, (e) => { e.preventDefault(); startMove('left'); });
            rightBtn.addEventListener(evt, (e) => { e.preventDefault(); startMove('right'); });
        });
        
        ['touchend', 'mouseup', 'mouseleave'].forEach(evt => {
            leftBtn.addEventListener(evt, stopMove);
            rightBtn.addEventListener(evt, stopMove);
        });

        // --- 遊戲流程 ---
        
        document.getElementById('startBtn').addEventListener('click', () => {
            modal.classList.add('hidden');
            initGame();
            loop();
        });

        function gameOver(win = false) {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            controls.classList.add('hidden');
            modal.classList.remove('hidden');
            
            let title = win ? "發現真跡！" : "行旅中斷";
            let msg = win ? 
                `恭喜！您在右下角樹蔭中找到了「范寬」二字！<br>最終得分：${score}<br><br><i>「前人謂范寬『寫山真骨』，果然名不虛傳。」</i>` :
                `驢隊遭遇墨雨阻礙。<br>得分：${score}<br><br><i>范寬云：「與其師人，不若師諸造化。」<br>請重新來過，觀察自然。</i>`;

            modal.innerHTML = `
                <h1>${title}</h1>
                <p>${msg}</p>
                <button class="btn" onclick="location.reload()">重新開始</button>
            `;
        }

        // 註冊 Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registered', reg))
                .catch(err => console.log('SW failed', err));
        }
    </script>
</body>
</html>
